name: Release

# Two entry points:
#   push of a vX.Y.Z tag  → build, sign, and create a DRAFT release with the
#                           artifacts attached. Nothing is public yet; the
#                           maintainer curates the notes and publishes.
#   release [released]    → the maintainer published that draft, so promote
#                           `:latest` in GHCR to match.
#
# Splitting it this way keeps `:latest` equal to the most recent *released*
# version. Promoting at tag time would point `:latest` at a version whose
# release is still an unpublished draft, and leave it silently wrong if that
# draft were abandoned.
#
# The `released` event fires only for non-prereleases (publishing a prerelease
# fires `prereleased` instead), so prereleases never move `:latest` and no
# explicit check is needed. GitHub suppresses release events raised by
# GITHUB_TOKEN, but a human publishing via the UI or their own token is not
# GITHUB_TOKEN, so this fires normally. If it ever does not, the manual
# fallback still works:
#   gh workflow run docker.yml --ref vX.Y.Z -f promote_tag=X.Y.Z
on:
  push:
    # Full SemVer only. 'v*' also matched v0.3, vfoo and vNEXT — the
    # prerelease-detect step rejected those, but the run should not start.
    tags: ['v*.*.*']
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true

permissions: {}

# Never cancel a release mid-flight: a cancellation between building the
# artifacts and attaching them leaves a half-populated draft. Queue instead.
concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Same gates PRs must pass. Previously this workflow re-implemented a weaker
  # subset inline (no smoke, no e2e), so a regression CI would have caught on a
  # PR could still ship in a tagged release.
  gates:
    if: github.event_name != 'release'
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read

  # Refuse to create the draft until the tagged image actually exists in GHCR.
  #
  # docker.yml is a separate workflow triggered by the same tag push, so the
  # two run in parallel and nothing connected them. In #93 that push never
  # produced a docker.yml run at all — GitHub delivered the event to release.yml
  # and not to docker.yml — so v0.3.7 published with no container images and
  # `:latest` sat a version behind for a week. The only symptom was a red
  # promote-latest run nobody read.
  #
  # Blocking the draft rather than checking afterwards: the draft is what a
  # human acts on. If the images are missing there is nothing to publish by
  # mistake, and the tag's release run is red where it will be seen.
  images:
    if: github.event_name != 'release'
    # Gated too: if the tree is bad, docker.yml will not build either, and
    # waiting 40 minutes for an image that was never coming is a poor way to
    # report a failing test.
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      # For `gh run list`, to fail fast when docker.yml has already failed.
      actions: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the tagged image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"

          # Both platforms, not just any manifest: buildx pushes a multi-arch
          # tag non-atomically, so the tag resolves while only linux/amd64 has
          # uploaded. Accepting that would green-light a release whose arm64
          # image does not exist yet.
          required_platforms="linux/amd64 linux/arm64"
          # Both images the release ships must exist: the serving image
          # (:VERSION) and the report generator (:report-VERSION), each
          # complete across all platforms.
          required_tags="${VERSION} report-${VERSION}"
          attempts=80
          delay=30

          # True only when a tag exists with every required platform.
          tag_complete() {
            local out
            out="$(docker buildx imagetools inspect "${IMAGE}:$1" 2>/dev/null || true)"
            [ -n "$out" ] || return 1
            for p in $required_platforms; do
              echo "$out" | grep -qF "Platform:    $p" || return 1
            done
            return 0
          }

          for i in $(seq 1 "$attempts"); do
            pending=""
            for t in $required_tags; do
              tag_complete "$t" || pending="${pending} ${t}"
            done
            if [ -z "$pending" ]; then
              echo "✅ present with ${required_platforms}: ${required_tags}"
              exit 0
            fi
            echo "waiting on tags:${pending} (attempt $i/$attempts)"

            # Fail fast rather than burning the full budget when the build has
            # already given up.
            #
            # Only the MOST RECENT run counts, matched exactly. Scanning several
            # runs for the substring "failure" would fire on a historical
            # failure that was since re-run successfully — which is precisely
            # the repair path taken for #93, where a failed run and a later
            # successful one both exist for the same commit. An empty
            # conclusion means still in progress: that is the normal case we
            # are waiting on, so it must not match.
            concl="$(gh run list --workflow=docker.yml --commit "$SHA" --limit 1 \
                       --json conclusion --jq '.[0].conclusion // ""' 2>/dev/null || true)"
            case "$concl" in
              failure|cancelled|timed_out)
                echo "::error::the latest docker.yml run for ${SHA} concluded '${concl}' — the image will not appear. Fix the build and re-push the tag."
                exit 1
                ;;
            esac

            sleep "$delay"
          done

          echo "::error::not all of [${required_tags}] appeared for ${IMAGE} with all of: ${required_platforms}."
          echo "::error::If no docker.yml run exists for ${SHA} at all, the tag push did not reach that workflow (this is what happened in #93). Re-run it manually: gh workflow run docker.yml --ref ${TAG_NAME}"
          exit 1

  release:
    if: github.event_name != 'release'
    needs: [gates, images]
    runs-on: ubuntu-24.04
    # dist-zip + sign + upload, then poll up to 30s for the docker.yml
    # dispatch to be enqueued.
    timeout-minutes: 30
    permissions:
      contents: write
      # Required for keyless cosign signing via Sigstore (Fulcio short-lived cert
      # tied to this workflow's OIDC identity, Rekor transparency-log entry).
      id-token: write
      # Required by actions/attest-build-provenance to record the attestation.
      attestations: write
      # NOTE: `actions: write` was dropped here. It existed for the `gh workflow
      # run` promote dispatch, which moved to the promote-latest job — this job
      # has not dispatched anything since.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes via git: softprops/action-gh-release and the
          # `gh workflow run` dispatch both take GITHUB_TOKEN explicitly.
          persist-credentials: false

      # Caching is explicitly OFF here. Omitting `cache:` is NOT enough —
      # setup-node v5+ caches automatically whenever package.json names a
      # package manager, so `package-manager-cache: false` is the actual
      # opt-out. Rationale: the npm cache is writable from PR-triggered CI
      # runs, so restoring it in the workflow that signs and publishes
      # artifacts would let a poisoned cache entry reach a release.
      # `npm ci` from scratch costs ~20s — cheap insurance on a tag build.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: make install

      # No verify/size-check step here: the `gates` job above already ran the
      # full `make ci`, and this job cannot start unless it passed. This job
      # only needs to reproduce the artifact — gate jobs run on separate
      # runners and share no filesystem, so dist/ has to be rebuilt.
      # `dist-zip` depends on `build`, so it is a single step.
      - name: Build dist.zip
        run: make dist-zip

      # Emit "<sha512>  dist.zip" — the canonical sha512sum --check format
      # so reviewers can verify with `sha512sum -c dist.zip.sha512`.
      - name: Generate SHA-512 checksum
        run: sha512sum dist.zip > dist.zip.sha512

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless blob signing: Sigstore exchanges the workflow's OIDC token
      # for a short-lived Fulcio cert, records the signing event in Rekor,
      # and writes a single `dist.zip.sigstore` bundle (signature + cert
      # chain + transparency-log inclusion proof). Verify with:
      #   cosign verify-blob dist.zip --bundle dist.zip.sigstore \
      #     --certificate-identity-regexp '^https://github\.com/no42-org/blitsbom/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign dist.zip with cosign (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist.zip.sigstore \
            dist.zip

      # An SBOM of the image already ships as an attestation on the container,
      # but the primary artifact for the zero-install path is dist.zip, and it
      # had none. syft scans the repo (package-lock.json) rather than the built
      # bundle: dist/ is a single inlined index.html, so scanning it would find
      # nothing — the meaningful inventory is the npm tree the bundle was
      # compiled from.
      - name: Generate CycloneDX SBOM of the source tree
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist.zip.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Human-viewable rendering of dist.zip.cdx.json, produced by this repo's
      # own report action. `uses: ./report` resolves to the tagged commit, so
      # each release dogfoods exactly the action version it ships, and the
      # generator image is pinned to the matching :report-VERSION tag — the
      # `images` job has already waited for that tag to exist in GHCR before
      # this job started.
      - name: Compute version from tag
        id: ver
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Render HTML report of the SBOM
        uses: ./report
        with:
          sbom: dist.zip.cdx.json
          output: dist.zip.cdx.html
          version: ${{ steps.ver.outputs.version }}
          image: ghcr.io/${{ github.repository }}:report-${{ steps.ver.outputs.version }}

      # SLSA build provenance, verifiable with:
      #   gh attestation verify dist.zip --repo no42-org/blitsbom
      # Listing the SBOM and its HTML report as further subjects means one
      # attestation covers all three, rather than derived files arriving as
      # unvouched-for neighbours of a signed artifact.
      - name: Attest build provenance for dist.zip + SBOM + report
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            dist.zip
            dist.zip.cdx.json
            dist.zip.cdx.html

      # Detect prerelease from the tag suffix. Anything matching
      # `vX.Y.Z-<alphanumeric>` (e.g. v1.0.0-rc.1, v0.2.0-beta.3) is published
      # as a prerelease, which keeps GitHub's "Latest release" badge — and
      # therefore the Docker `:latest` retag in docker.yml — pointing at the
      # most recent stable release.
      - name: Detect prerelease from tag
        id: prerelease
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "::error::TAG_NAME is empty (no inputs.tag and no ref_name)"
            exit 1
          fi
          # Anchored full-SemVer match. Stable: vX.Y.Z exactly (no suffix).
          # Prerelease: vX.Y.Z-<identifier>(.<identifier>)* with optional +build.
          # Anything else (e.g. vX.Y.Z.W, malformed) is rejected outright so
          # we never silently promote a malformed tag.
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::TAG_NAME '$TAG_NAME' is not a valid SemVer tag (expected vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])"
            exit 1
          fi

      # Created as a DRAFT: nothing is visible until the maintainer curates the
      # notes and publishes. `generate_release_notes` still runs, so the draft
      # opens with the raw commit list as raw material rather than a blank box.
      #
      # `make_latest: legacy` lets GitHub decide which non-prerelease release
      # is "Latest" using its built-in semver date logic — so a hotfix tag
      # pushed against an older minor line won't clobber the Latest badge of
      # a newer tag.
      - name: Attach dist.zip + checksum + cosign bundle to draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            dist.zip
            dist.zip.sha512
            dist.zip.sigstore
            dist.zip.cdx.json
            dist.zip.cdx.html
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          make_latest: legacy

      - name: Summarise next step
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          {
            echo "### Draft release created for \`${TAG_NAME}\`"
            echo
            echo "Artifacts are attached and signed. Nothing is public yet."
            echo
            echo "1. Curate the notes (highlights, breaking changes, fixes)."
            echo "2. Publish:"
            echo
            echo '```'
            echo "gh release edit ${TAG_NAME} --notes-file notes.md --draft=false"
            echo '```'
            echo
            echo "Publishing fires the \`released\` event, which promotes \`:latest\` in GHCR."
          } >> "$GITHUB_STEP_SUMMARY"

  # Fires when the maintainer publishes the draft above, which is the moment
  # `:latest` should start pointing at this version. Only `released` is
  # subscribed, so publishing a prerelease does not reach this job at all.
  #
  # This job builds nothing and needs no gates: it dispatches a re-tag of a
  # manifest that was already built and gated at tag time.
  promote-latest:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Only to dispatch docker.yml. No contents/packages write: the re-tag
      # itself happens in docker.yml under its own narrower permissions.
      actions: write
    steps:
      - name: Promote :latest in GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$TAG_NAME" ]; then
            echo "::error::TAG_NAME is empty — refusing to dispatch promote-latest"
            exit 1
          fi
          VERSION="${TAG_NAME#v}"

          # Snapshot the most recent docker.yml run ID before dispatching so
          # we can detect that a new run actually got enqueued (gh CLI can
          # return 200 while GitHub silently drops the dispatch).
          PRE_RUN_ID="$(gh run list --workflow=docker.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          echo "Most recent docker.yml run before dispatch: ${PRE_RUN_ID}"

          # --ref "$TAG_NAME" so the promote-latest job runs against the
          # workflow definition at the tagged commit. Using --ref main would
          # break releases cut from a hotfix branch or any non-main ref.
          # Retry transient gh API failures.
          attempts=3
          delay=10
          for i in $(seq 1 "$attempts"); do
            if gh workflow run docker.yml --ref "$TAG_NAME" -f promote_tag="${VERSION}"; then
              echo "Dispatched docker.yml with promote_tag=${VERSION}"
              break
            fi
            if [ "$i" = "$attempts" ]; then
              echo "::error::gh workflow run failed after ${attempts} attempts"
              exit 1
            fi
            echo "gh workflow run failed (attempt $i/$attempts), retrying in ${delay}s..."
            sleep "$delay"
          done

          # Confirm a new docker.yml run was actually enqueued (poll up to 30s).
          echo "Confirming new docker.yml run was enqueued..."
          for i in 1 2 3 4 5 6; do
            CURRENT_RUN_ID="$(gh run list --workflow=docker.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CURRENT_RUN_ID" -gt "$PRE_RUN_ID" ]; then
              echo "docker.yml run enqueued: ${CURRENT_RUN_ID}"
              exit 0
            fi
            if [ "$i" = "6" ]; then
              echo "::error::No new docker.yml run was enqueued within 30s after dispatch"
              exit 1
            fi
            sleep 5
          done
