name: Docker Image

# Two-mode flow:
#   push to main / vX.Y.Z              → build-and-push job builds and pushes
#                                        the image with version-specific tags
#                                        only (no `:latest`).
#   workflow_dispatch + promote_tag    → promote-latest job re-tags the
#                                        existing image as `:latest`. This is
#                                        the path release.yml takes after
#                                        creating a non-prerelease GitHub
#                                        Release, and the same path a human
#                                        can take to manually re-promote.
#
# The `release: [released]` event is NOT used: when softprops/action-gh-release
# creates a release with the default GITHUB_TOKEN, GitHub deliberately
# suppresses the resulting release event to prevent recursive workflow loops.
# `workflow_dispatch` is the documented exception — it fires even when
# triggered by GITHUB_TOKEN-authenticated `gh workflow run` calls.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Version to promote to :latest (e.g. 0.2.8). Empty = run build-and-push as normal.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  # Required for keyless cosign signing via Sigstore (Fulcio short-lived cert
  # tied to this workflow's OIDC identity, Rekor transparency-log entry).
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.promote_tag == '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Multi-arch builds: QEMU emulates linux/arm64 binaries on the
      # amd64 runner so the build stage can cross-build for both targets.
      # The final image is a single multi-arch manifest list per tag, so
      # consumers get the right binaries via `docker pull` automatically.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the image tags from the Git ref:
      #   - push to main          → :rc and :main-<short-sha>
      #   - push of vX.Y.Z tag    → :X.Y.Z and :X.Y (NOT :latest — that is
      #                             handled by the promote-latest job, which
      #                             is dispatched by release.yml after a
      #                             non-prerelease GitHub Release is published)
      #   - workflow_dispatch     → :rc (treated like main, when promote_tag
      #                             is empty)
      # `flavor: latest=false` disables metadata-action's auto-latest behavior;
      # we control `:latest` strictly via the promote-latest job.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=rc,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      # Refuse to build when no tag would be produced — this happens if an
      # operator dispatches this workflow against a non-main, non-tag ref
      # with an empty promote_tag. Without this guard, build-push-action
      # fails with a non-obvious "no tags specified" error several minutes
      # into the build.
      - name: Guard against empty tag list
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$(echo "$TAGS" | tr -d '[:space:]')" ]; then
            echo "::error::metadata-action produced no tags for ref '${GITHUB_REF}'. This usually means workflow_dispatch was invoked against a non-main, non-tag ref with an empty promote_tag."
            exit 1
          fi
          echo "Tags to push:"
          printf '%s\n' "$TAGS"

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless image signing: sign the immutable digest (not a mutable tag)
      # so the signature is stable even when `:latest` / `:0.2` move. For
      # multi-arch images the digest is the manifest list's digest, and
      # cosign signs the list — consumers pulling either platform end up
      # with a manifest digest that chains back to the signed list. Verify with:
      #   cosign verify ghcr.io/no42-org/blitsbom@sha256:... \
      #     --certificate-identity-regexp '^https://github\.com/no42-org/blitsbom/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign published image with cosign (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # CycloneDX SBOM generated by syft against the pushed image — captures
      # the Alpine base layer + the bundled static assets. For multi-arch
      # images, syft scans the runner's native platform (linux/amd64); the
      # arm64 SBOM would differ only in the architecture-specific Alpine
      # binary packages and is not separately attested.
      - name: Generate CycloneDX SBOM of the image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Attach the SBOM to the image as an in-toto attestation. Consumers
      # can pull it back with `cosign download attestation`.
      - name: Attest CycloneDX SBOM to image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "$IMAGE"

  # Promote `:latest` to point at the released version. Triggered explicitly
  # via `gh workflow run docker.yml -f promote_tag=X.Y.Z` from release.yml
  # after it publishes a non-prerelease GitHub Release, or manually by an
  # operator for emergency recovery. The image is re-tagged via
  # `docker buildx imagetools create`, which only writes a new manifest
  # pointer — no rebuild, and the existing cosign signature on the digest
  # continues to apply.
  promote-latest:
    if: |
      github.event_name == 'workflow_dispatch' && inputs.promote_tag != ''
    runs-on: ubuntu-latest
    # Serialize promote-latest dispatches so two parallel runs (e.g. a hotfix
    # release racing the main release) cannot finish out of order and leave
    # `:latest` pinned to the older version.
    concurrency:
      group: promote-latest
      cancel-in-progress: false
    # Least-privilege per-job override. promote-latest only re-tags a manifest
    # list in GHCR — it does not sign, attest, or write repo contents — so it
    # must not inherit the workflow-level `id-token: write` / `contents: read`.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote :latest to point at the released version
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          set -euo pipefail
          # Trim whitespace so "   " doesn't slip past the inputs.promote_tag != '' gate.
          TRIMMED="$(echo "$PROMOTE_TAG" | tr -d '[:space:]')"
          if [ -z "$TRIMMED" ]; then
            echo "::error::promote_tag is empty or whitespace"
            exit 1
          fi
          # Strip any number of leading 'v' (handles 'vv1.2.3' typos) before validation.
          VERSION="$(echo "$TRIMMED" | sed -E 's/^v+//')"
          # Reject anything that is not a full SemVer X.Y.Z[-PRERELEASE][+BUILD].
          # Without this, an operator could re-tag from 'rc', 'main-abc123', or
          # even 'latest' itself by passing it as promote_tag.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::promote_tag '$PROMOTE_TAG' is not a valid SemVer version"
            exit 1
          fi
          echo "Promoting ${IMAGE}:${VERSION} to ${IMAGE}:latest"

          # release.yml dispatches this workflow in parallel with the build,
          # so the source tag may not be resolvable for ~30-60s. Wait up to
          # ~10 minutes — slow QEMU-emulated linux/arm64 builds can blow past
          # 5 min on a busy runner. Small jitter on the delay avoids slamming
          # the registry in lock-step.
          #
          # CRITICAL: buildx pushes multi-arch tags non-atomically — the tag
          # can resolve while only linux/amd64 has been uploaded, before
          # linux/arm64 finishes. If we re-tag at that instant, `:latest`
          # ends up pinned to the amd64-only intermediate state and arm64
          # consumers get "no matching manifest" errors. Require BOTH
          # expected platforms to appear in the manifest list before
          # proceeding.
          required_platforms="linux/amd64 linux/arm64"
          attempts=40
          base_delay=15
          for i in $(seq 1 "$attempts"); do
            inspect_output="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>/dev/null || true)"
            if [ -n "$inspect_output" ]; then
              missing=""
              for p in $required_platforms; do
                if ! echo "$inspect_output" | grep -qF "Platform:    $p"; then
                  missing="${missing} ${p}"
                fi
              done
              if [ -z "$missing" ]; then
                echo "Source tag ${IMAGE}:${VERSION} has all required platforms: ${required_platforms}"
                break
              fi
              echo "Source tag exists but is missing platforms:${missing} (attempt $i/$attempts)"
            else
              echo "Source tag not yet available (attempt $i/$attempts)"
            fi
            if [ "$i" = "$attempts" ]; then
              echo "::error::Source tag ${IMAGE}:${VERSION} never became complete (all of: ${required_platforms}) after ${attempts} attempts"
              exit 1
            fi
            delay=$((base_delay + RANDOM % 5))
            echo "Retrying in ${delay}s..."
            sleep "$delay"
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}"

          # Verify the create actually moved `:latest`. `imagetools create`
          # can return success on registry quirks while leaving the manifest
          # pointer unchanged; we'd rather fail loudly than silently ship
          # a stale `:latest`.
          SRC_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          DST_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:latest"   --format '{{.Manifest.Digest}}')"
          if [ -z "$SRC_DIGEST" ] || [ -z "$DST_DIGEST" ] || [ "$SRC_DIGEST" != "$DST_DIGEST" ]; then
            echo "::error::Promote verification failed: ${IMAGE}:latest digest ('$DST_DIGEST') does not match ${IMAGE}:${VERSION} ('$SRC_DIGEST')"
            exit 1
          fi
          echo "Promoted ${IMAGE}:latest → ${DST_DIGEST}"
