name: Docker Image

# Two-mode flow:
#   push to main / vX.Y.Z              → build-and-push job builds and pushes
#                                        the image with version-specific tags
#                                        only (no `:latest`).
#   workflow_dispatch + promote_tag    → promote-latest job re-tags the
#                                        existing image as `:latest`. This is
#                                        the path release.yml takes after
#                                        creating a non-prerelease GitHub
#                                        Release, and the same path a human
#                                        can take to manually re-promote.
#
# The `release: [released]` event is NOT used: when softprops/action-gh-release
# creates a release with the default GITHUB_TOKEN, GitHub deliberately
# suppresses the resulting release event to prevent recursive workflow loops.
# `workflow_dispatch` is the documented exception — it fires even when
# triggered by GITHUB_TOKEN-authenticated `gh workflow run` calls.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Version to promote to :latest (e.g. 0.2.8). Empty = run build-and-push as normal.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  # Required for keyless cosign signing via Sigstore (Fulcio short-lived cert
  # tied to this workflow's OIDC identity, Rekor transparency-log entry).
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.promote_tag == '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Multi-arch builds: QEMU emulates linux/arm64 binaries on the
      # amd64 runner so the build stage can cross-build for both targets.
      # The final image is a single multi-arch manifest list per tag, so
      # consumers get the right binaries via `docker pull` automatically.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the image tags from the Git ref:
      #   - push to main          → :rc and :main-<short-sha>
      #   - push of vX.Y.Z tag    → :X.Y.Z and :X.Y (NOT :latest — that is
      #                             handled by the promote-latest job, which
      #                             is dispatched by release.yml after a
      #                             non-prerelease GitHub Release is published)
      #   - workflow_dispatch     → :rc (treated like main, when promote_tag
      #                             is empty)
      # `flavor: latest=false` disables metadata-action's auto-latest behavior;
      # we control `:latest` strictly via the promote-latest job.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=rc,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless image signing: sign the immutable digest (not a mutable tag)
      # so the signature is stable even when `:latest` / `:0.2` move. For
      # multi-arch images the digest is the manifest list's digest, and
      # cosign signs the list — consumers pulling either platform end up
      # with a manifest digest that chains back to the signed list. Verify with:
      #   cosign verify ghcr.io/no42-org/blitsbom@sha256:... \
      #     --certificate-identity-regexp '^https://github\.com/no42-org/blitsbom/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign published image with cosign (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # CycloneDX SBOM generated by syft against the pushed image — captures
      # the Alpine base layer + the bundled static assets. For multi-arch
      # images, syft scans the runner's native platform (linux/amd64); the
      # arm64 SBOM would differ only in the architecture-specific Alpine
      # binary packages and is not separately attested.
      - name: Generate CycloneDX SBOM of the image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Attach the SBOM to the image as an in-toto attestation. Consumers
      # can pull it back with `cosign download attestation`.
      - name: Attest CycloneDX SBOM to image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "$IMAGE"

  # Promote `:latest` to point at the released version. Triggered explicitly
  # via `gh workflow run docker.yml -f promote_tag=X.Y.Z` from release.yml
  # after it publishes a non-prerelease GitHub Release, or manually by an
  # operator for emergency recovery. The image is re-tagged via
  # `docker buildx imagetools create`, which only writes a new manifest
  # pointer — no rebuild, and the existing cosign signature on the digest
  # continues to apply.
  promote-latest:
    if: |
      github.event_name == 'workflow_dispatch' && inputs.promote_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote :latest to point at the released version
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          set -euo pipefail
          VERSION="${PROMOTE_TAG#v}"
          echo "Promoting ${IMAGE}:${VERSION} to ${IMAGE}:latest"

          # release.yml dispatches this workflow in parallel with the build,
          # so the source tag may not be resolvable for ~30-60s. Wait up to
          # ~5 minutes rather than failing the run on a transient race.
          attempts=30
          delay=10
          for i in $(seq 1 "$attempts"); do
            if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "Source tag ${IMAGE}:${VERSION} is available"
              break
            fi
            if [ "$i" = "$attempts" ]; then
              echo "::error::Source tag ${IMAGE}:${VERSION} never became available after ${attempts} attempts"
              exit 1
            fi
            echo "Source tag not yet available (attempt $i/$attempts), retrying in ${delay}s..."
            sleep "$delay"
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}"

          echo "Promoted ${IMAGE}:latest → digest of ${IMAGE}:${VERSION}"
