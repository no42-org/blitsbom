# TEMPORARY — deleted before merge. Proves GitHub's own parser accepts the
# `artifact-metadata` permission scope, which actionlint says is valid.
name: perm test
on:
  push:
    branches: [ci/artifact-metadata]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
    steps:
      - run: echo "workflow parsed; artifact-metadata accepted"
