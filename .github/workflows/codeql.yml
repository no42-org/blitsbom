name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan on Monday 06:17 UTC — catches new CodeQL rules even when
    # the repo is quiet. Offset minute to avoid the cron-storm at :00.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # JS/TS is interpreted — no compile step required. The security-and-quality
      # suite layers maintainability + reliability rules on top of the default
      # security pack, matching the "code quality scanning" intent.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          # samples/ holds large real-world SBOM JSON fixtures (not source);
          # dist/ is the build output. Excluding both keeps the extractor fast.
          config: |
            paths-ignore:
              - dist
              - samples
              - node_modules

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          category: /language:javascript-typescript
