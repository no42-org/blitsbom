name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan on Monday 06:17 UTC — catches new CodeQL rules even when
    # the repo is quiet. Offset minute to avoid the cron-storm at :00.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    # CodeQL extraction + analysis on a small JS/TS tree is a few minutes;
    # 20 catches a wedged extractor without truncating a slow-but-healthy run.
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # JS/TS is interpreted — no compile step required. The security-and-quality
      # suite layers maintainability + reliability rules on top of the default
      # security pack, matching the "code quality scanning" intent.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1  # v4.37.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          # samples/ holds large real-world SBOM JSON fixtures (not source);
          # dist/ is the build output. Excluding both keeps the extractor fast.
          config: |
            paths-ignore:
              - dist
              - samples
              - node_modules

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          category: /language:javascript-typescript
