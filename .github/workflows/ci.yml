name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs are wasted work: a force-push to a PR branch makes the
# in-flight run's verdict irrelevant. Cancelling is safe here because CI
# publishes nothing (unlike release.yml / docker.yml, which must not be
# cancelled mid-publish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates themselves live in gates.yml so release.yml and docker.yml
  # enforce exactly what PRs enforce. Add checks there, not here.
  gates:
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read
