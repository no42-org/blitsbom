name: SBOM drift

# Catches a generator/parser mismatch before it reaches a release.
#
# The release SBOM is generated at *release* time, so nothing in the PR gates
# exercises it. A bump of `anchore/sbom-action` therefore merges green and
# first shows up as a published release whose `dist.zip.cdx.json` the viewer
# shipped beside it cannot open — which is exactly how #171 would have landed
# (syft 1.46 emits CycloneDX 1.7; the version gate accepted only 1.4-1.6).
#
# `report-smoke.yml` cannot cover this: it feeds the generator a checked-in
# sample, so the SBOM never varies and no amount of syft drift changes its
# outcome. This job generates a *fresh* SBOM with the same pinned action the
# release uses, then asserts the parser accepts it.
#
# Scoped to workflow changes on purpose. Since #174 opened the version gate to
# any CycloneDX 1.x, an action bump can only break the viewer by jumping a
# major, so this is insurance rather than a routine gate — and the risk arrives
# specifically as a diff to these files, because Dependabot rewrites every
# occurrence of the pinned SHA. Running it on every PR would buy nothing and
# cost a full build.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-fresh-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: make install

      # Must stay byte-identical to the invocation in release.yml, including
      # the pinned SHA and every SYFT_* override: this job is only meaningful
      # if it exercises the same generator the release does. When Dependabot
      # bumps the action it rewrites both occurrences, which is what makes this
      # gate fire on the PR that introduces the risk.
      - name: Generate a fresh SBOM with the release pipeline's generator
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        env:
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
          SYFT_SELECT_CATALOGERS: "-github-actions"
          SYFT_FILE_METADATA_SELECTION: "none"
        with:
          path: .
          format: cyclonedx-json
          output-file: drift-check.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Build the app and the generator, then parse the fresh SBOM through the
      # generator — which imports the app's own parser, so acceptance here means
      # acceptance in the viewer.
      - name: Build the app and the report generator
        run: make build build-generator

      - name: Assert the parser accepts it
        run: |
          set -euo pipefail
          test -s drift-check.cdx.json || { echo "no SBOM was generated"; exit 1; }
          spec_version=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("drift-check.cdx.json","utf8")).specVersion ?? "unknown"))')
          syft_version=$(node -e 'const t=JSON.parse(require("fs").readFileSync("drift-check.cdx.json","utf8")).metadata?.tools?.components?.[0]; process.stdout.write(String(t?.version ?? "unknown"))')
          echo "generator: syft ${syft_version} -> CycloneDX ${spec_version}"
          make report SBOM=drift-check.cdx.json OUT=drift-check.html
          test -s drift-check.html || { echo "generator produced no report"; exit 1; }
          echo "OK: the current parser accepts what the release pipeline generates"

      # A version outside the verified range still passes the job — it parses,
      # which is the contract. Surface it so the reviewer of the bump knows the
      # published SBOM's format moved and the header will caveat it (#175).
      - name: Note when the spec version is outside the verified range
        run: |
          set -euo pipefail
          spec_version=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("drift-check.cdx.json","utf8")).specVersion ?? ""))')
          # Read the ceiling from the constant the app itself uses, so this
          # note cannot disagree with what the header will show.
          verified=$(sed -n 's/^export const CDX_HIGHEST_VERIFIED_MINOR = \([0-9][0-9]*\);.*/\1/p' src/types.ts)
          test -n "$verified" || { echo "could not read CDX_HIGHEST_VERIFIED_MINOR from src/types.ts"; exit 1; }
          minor=${spec_version#*.}
          if [ "${spec_version%%.*}" = "1" ] && [ "${minor:-0}" -gt "$verified" ]; then
            echo "::warning::This bump moves the release SBOM to CycloneDX ${spec_version}, newer than the verified ceiling (1.${verified}). It parses, but reports will mark it \"newer than this build\" until the schema is diffed and a fixture added — see RELEASING.md, \"Verifying a new CycloneDX minor\"."
          fi
