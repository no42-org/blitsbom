name: SBOM drift

# Catches a generator/parser mismatch before it reaches a release.
#
# The release SBOM is generated at *release* time, so nothing in the PR gates
# exercises it. A generator bump therefore merges green and first shows up as
# a published release whose `dist.zip.cdx.json` the viewer shipped beside it
# cannot open — which is exactly how #171 would have landed (syft 1.46 emits
# CycloneDX 1.7; the version gate accepted only 1.4-1.6).
#
# `report-smoke.yml` cannot cover this: it feeds the generator a checked-in
# sample, so the SBOM never varies and no amount of syft drift changes its
# outcome. This job runs `make sbom` — the same target the release calls — and
# asserts the parser accepts the result.
#
# Since the generator moved into `make sbom` (#172) there is no separate
# invocation to keep in sync: this job and the release run the same recipe
# against the same digest-pinned syft stage. What is left to catch is a syft
# bump changing the output in a way the parser rejects.
#
# Scoped on purpose rather than run on every PR. Since #174 opened the version
# gate to any CycloneDX 1.x, a generator bump can only break the viewer by
# jumping a major, so this is insurance — and the bump arrives specifically as
# a diff to the files below: the Dockerfile carries the syft pin, the Makefile
# carries the scan options.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      # Carries the digest-pinned syft stage the release SBOM is generated
      # from, and the report generator's own base image. Dependabot's docker
      # ecosystem bumps both.
      - 'Dockerfile'
      # Owns the scan target and the three SYFT_* overrides.
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: sbom-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parse-fresh-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: make install

      # The same target release.yml calls, so this exercises the generator
      # the release actually uses rather than a copy of its configuration.
      - name: Generate a fresh SBOM the way the release does
        run: make sbom OUT=drift-check.cdx.json

      # Parse the fresh SBOM through the report generator, which imports the
      # app's own parser, so acceptance here means acceptance in the viewer.
      # `make report` already builds both, so no separate build step.
      - name: Assert the parser accepts it
        run: |
          set -euo pipefail
          test -s drift-check.cdx.json || { echo "no SBOM was generated"; exit 1; }
          spec_version=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("drift-check.cdx.json","utf8")).specVersion ?? "unknown"))')
          # Handle both metadata.tools shapes: the 1.5+ object and the <=1.4
          # array. A pin rollback to 1.4 is exactly when this line is read.
          syft_version=$(node -e 'const t=JSON.parse(require("fs").readFileSync("drift-check.cdx.json","utf8")).metadata?.tools; const c=Array.isArray(t)?t[0]:t?.components?.[0]; process.stdout.write(String(c?.version ?? "unknown"))')
          echo "generator: syft ${syft_version} -> CycloneDX ${spec_version}"
          make report SBOM=drift-check.cdx.json OUT=drift-check.html
          test -s drift-check.html || { echo "generator produced no report"; exit 1; }
          # A report can be structurally valid and carry nothing. Assert the
          # parser actually found components, or this gate greenlights the
          # regression it exists to catch.
          components=$(node -e 'const d=JSON.parse(require("fs").readFileSync("drift-check.cdx.json","utf8")); process.stdout.write(String((d.components||[]).length))')
          test "$components" -gt 0 || { echo "::error::the generated SBOM has no components"; exit 1; }
          grep -q 'id="blitsbom-sbom"' drift-check.html || { echo "::error::report carries no embedded payload"; exit 1; }
          echo "OK: parser accepted ${components} components from what the release pipeline generates"

      # A version outside the verified range still passes the job — it parses,
      # which is the contract. Surface it so the reviewer of the bump knows the
      # published SBOM's format moved and the header will caveat it (#175).
      - name: Note when the spec version is outside the verified range
        run: |
          set -euo pipefail
          spec_version=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("drift-check.cdx.json","utf8")).specVersion ?? ""))')
          # Validate before any arithmetic or echo. An unexpected shape like
          # "1.6.1" would otherwise make `[ "6.1" -gt 6 ]` error out; because
          # that runs as an `if` condition, `set -e` does not fire and the
          # drift would go unreported. This also keeps unvalidated file
          # content out of a `::`-prefixed workflow command.
          expr "$spec_version" : '^[0-9][0-9]*\.[0-9][0-9]*$' >/dev/null || {
            echo "::error::specVersion '${spec_version}' is not <major>.<minor>, so it cannot be compared against the verified ceiling"; exit 1; }
          # Read the ceiling from the constant the app itself uses, so this
          # note cannot disagree with what the header will show. Tolerates an
          # optional type annotation so a formatter change cannot break CI.
          verified=$(sed -n 's/^export const CDX_HIGHEST_VERIFIED_MINOR[^=]*= *\([0-9][0-9]*\).*/\1/p' src/types.ts | head -1)
          test -n "$verified" || { echo "::error::could not read CDX_HIGHEST_VERIFIED_MINOR from src/types.ts"; exit 1; }
          minor=${spec_version#*.}
          if [ "${spec_version%%.*}" = "1" ] && [ "$minor" -gt "$verified" ]; then
            echo "::warning::This bump moves the release SBOM to CycloneDX ${spec_version}, newer than the verified ceiling (1.${verified}). It parses, but reports will mark it \"newer than this build\" until the schema is diffed and a fixture added — see RELEASING.md, \"Verifying a new CycloneDX minor\"."
          fi
