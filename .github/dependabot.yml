version: 2
# `cooldown` holds back brand-new releases for a few days. A compromised
# package is typically yanked within hours of discovery, so waiting means
# Dependabot never proposes the malicious version in the first place.
# Security advisories bypass cooldown, so real fixes still arrive immediately.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: scope
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    labels:
      - dependencies
      - npm
    ignore:
      # Tailwind v4 is a rewrite (CSS-first @theme, @tailwindcss/postcss).
      # Track major upgrades as their own change proposal, not Dependabot.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
