name: Enhancement request
description: Suggest a feature or an improvement
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Before writing: blitsbom is deliberately small. It runs entirely in the browser with **no network access ever**, and ships under a 60 KB gzipped JS budget. Ideas that need a server, an API call, or a large dependency are very unlikely to land — not because they are bad, but because they are a different product.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you are in, not the feature you have in mind. It often turns out there is an easier fix.
      placeholder: I need to hand our auditor a list of only the copyleft components, and right now I export everything to CSV and filter it in a spreadsheet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including "I currently work around it by…".
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: These are hard requirements of the project, enforced by CI.
      options:
        - label: This works entirely in the browser, with no network calls
          required: true
        - label: I have searched existing issues for the same idea
          required: true
