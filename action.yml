name: blitsbom SBOM report
description: >-
  Generate a self-contained, offline HTML SBOM report from a CycloneDX or SPDX
  SBOM using the blitsbom report generator image. Provenance defaults are taken
  from the workflow context.

inputs:
  sbom:
    description: Path to the source SBOM (JSON), relative to the workspace.
    required: true
  output:
    description: Output HTML path, relative to the workspace.
    required: false
    default: sbom-report.html
  vex:
    description: Optional CycloneDX VEX to merge, relative to the workspace.
    required: false
    default: ''
  compress:
    description: Payload encoding — auto | always | never.
    required: false
    default: auto
  project:
    description: Product name (defaults to the repository name).
    required: false
    default: ${{ github.event.repository.name }}
  version:
    description: Product version (defaults to the ref name, leading v stripped).
    required: false
    default: ''
  image:
    description: >-
      Report generator image to run. Defaults to the image matching the version
      of this action you called (`@v0.6.0` → `:report-0.6.0`), so the action and
      the generator cannot disagree.
    required: false
    default: ''

outputs:
  report:
    description: Path to the generated report (equal to the `output` input).
    value: ${{ steps.generate.outputs.report }}

branding:
  icon: file-text
  color: gray-dark

runs:
  using: composite
  steps:
    - id: generate
      shell: bash
      env:
        IMAGE_IN: ${{ inputs.image }}
        ACTION_REF: ${{ github.action_ref }}
        SBOM: ${{ inputs.sbom }}
        OUTPUT: ${{ inputs.output }}
        VEX: ${{ inputs.vex }}
        COMPRESS: ${{ inputs.compress }}
        PROJECT: ${{ inputs.project }}
        VERSION_IN: ${{ inputs.version }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        COMMIT: ${{ github.sha }}
        BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        # Version precedence: the explicit input, else the tag name with a
        # leading 'v' stripped (v2.4.1 → 2.4.1). Only derive from the ref when
        # it is actually a tag — on a branch or PR run github.ref_name is
        # "main" or "123/merge", which is not a version. When neither applies,
        # leave it empty so the report falls back to the SBOM's own version.
        VERSION="${VERSION_IN}"
        if [ -z "${VERSION}" ] && [ "${REF_TYPE}" = "tag" ]; then
          VERSION="${REF_NAME#v}"
        fi

        # Image precedence: the explicit input, else the generator image built
        # from this same commit — `uses: no42-org/blitsbom@v0.6.0` runs
        # :report-0.6.0, so the action and the generator can never disagree
        # about their version. github.action_ref is empty for a local
        # `uses: ./` and is a branch name for anyone tracking main; neither
        # names a published image, so fall back to the tag that follows main.
        # Only a full vX.Y.Z release tag maps to an image: a major alias like
        # @v1 has no :report-1 counterpart in GHCR, and deriving one would
        # fail the pull outright rather than degrade to something that runs.
        IMAGE="${IMAGE_IN}"
        if [ -z "${IMAGE}" ]; then
          case "${ACTION_REF}" in
            v[0-9]*.[0-9]*.[0-9]*) IMAGE="ghcr.io/no42-org/blitsbom:report-${ACTION_REF#v}" ;;
            *)                     IMAGE="ghcr.io/no42-org/blitsbom:report-rc" ;;
          esac
        fi

        args=("/work/${SBOM}" --output "/work/${OUTPUT}" --compress "${COMPRESS}")
        [ -n "${VEX}" ] && args+=(--vex "/work/${VEX}")
        [ -n "${PROJECT}" ] && args+=(--project "${PROJECT}")
        [ -n "${VERSION}" ] && args+=(--version "${VERSION}")
        [ -n "${COMMIT}" ] && args+=(--commit "${COMMIT}")
        [ -n "${BUILD_URL}" ] && args+=(--build-url "${BUILD_URL}")

        docker run --rm -v "${GITHUB_WORKSPACE}:/work" -w /work "${IMAGE}" "${args[@]}"

        echo "report=${OUTPUT}" >> "${GITHUB_OUTPUT}"
