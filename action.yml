name: blitsbom SBOM report
# Keep under 125 characters: the Marketplace rejects a longer description at
# publish time, and nothing in CI checks it.
description: >-
  Turn a CycloneDX or SPDX SBOM into one self-contained HTML report you can
  attach to a release. Works offline.

inputs:
  sbom:
    description: Path to the source SBOM (JSON), relative to the workspace.
    required: true
  output:
    description: Output HTML path, relative to the workspace.
    required: false
    default: sbom-report.html
  vex:
    description: Optional CycloneDX VEX to merge, relative to the workspace.
    required: false
    default: ''
  compress:
    description: Payload encoding — auto | always | never.
    required: false
    default: auto
  project:
    description: Product name (defaults to the repository name).
    required: false
    default: ${{ github.event.repository.name }}
  version:
    description: Product version (defaults to the ref name, leading v stripped).
    required: false
    default: ''
  image:
    description: >-
      Report generator image to run. Defaults to the image matching the version
      of the action you called — a release tag or a commit pinned to one
      (`@v0.6.0` → `:report-0.6.0`) — so the two cannot disagree. A branch ref
      gets `:report-rc`, the generator built from main.
    required: false
    default: ''

outputs:
  report:
    description: Path to the generated report (equal to the `output` input).
    value: ${{ steps.generate.outputs.report }}

# A Marketplace listing cannot carry a custom logo — only a Feather icon name
# and a colour from a fixed palette. These echo assets/logo.svg, whose mark is
# vertical bars of varying height in teal and blue.
branding:
  icon: bar-chart-2
  color: blue

runs:
  using: composite
  steps:
    - id: generate
      shell: bash
      env:
        IMAGE_IN: ${{ inputs.image }}
        ACTION_REF: ${{ github.action_ref }}
        SBOM: ${{ inputs.sbom }}
        OUTPUT: ${{ inputs.output }}
        VEX: ${{ inputs.vex }}
        COMPRESS: ${{ inputs.compress }}
        PROJECT: ${{ inputs.project }}
        VERSION_IN: ${{ inputs.version }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        COMMIT: ${{ github.sha }}
        BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        # Version precedence: the explicit input, else the tag name with a
        # leading 'v' stripped (v2.4.1 → 2.4.1). Only derive from the ref when
        # it is actually a tag — on a branch or PR run github.ref_name is
        # "main" or "123/merge", which is not a version. When neither applies,
        # leave it empty so the report falls back to the SBOM's own version.
        VERSION="${VERSION_IN}"
        if [ -z "${VERSION}" ] && [ "${REF_TYPE}" = "tag" ]; then
          VERSION="${REF_NAME#v}"
        fi

        # Match the generator to the source the action came from, so the two
        # cannot disagree about their version. Precedence: the explicit `image:`
        # input, a vX.Y.Z tag, the version in the action's own package.json
        # (all a SHA pin has to go on), then :report-rc.
        #
        # A tag beats package.json because docker.yml names the image from the
        # git tag via `type=semver`. :report-rc is the generator built from
        # main, so it pairs correctly with a ref that tracks main, and is the
        # floor whenever no usable version can be read.
        IMAGE="${IMAGE_IN}"
        if [ -z "${IMAGE}" ]; then
          VERSION_TAG=""
          RESOLVED_FROM=""

          if [[ "${ACTION_REF}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            VERSION_TAG="${BASH_REMATCH[1]}"
            RESOLVED_FROM="tag ${ACTION_REF}"
          elif [[ "${ACTION_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            # Two-space anchor keeps this to the top-level key. Allowed to fail
            # — an unreadable or absent file must reach the floor, not abort.
            VERSION_TAG="$(
              sed -n 's/^  "version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                "${GITHUB_ACTION_PATH:-}/package.json" 2>/dev/null | head -1 || true
            )"
            RESOLVED_FROM="package.json at the pinned commit"
          fi

          # Reject anything not shaped like a version: it would name an image
          # never published, or an illegal one — '+' is invalid in an OCI tag.
          if [[ ! "${VERSION_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            VERSION_TAG=""
          fi

          if [ -n "${VERSION_TAG}" ]; then
            IMAGE="ghcr.io/no42-org/blitsbom:report-${VERSION_TAG}"
          else
            IMAGE="ghcr.io/no42-org/blitsbom:report-rc"
            RESOLVED_FROM="no usable version for ref '${ACTION_REF}' — using the main-tip generator"
          fi

          echo "generator image: ${IMAGE} (${RESOLVED_FROM})"
        fi

        args=("/work/${SBOM}" --output "/work/${OUTPUT}" --compress "${COMPRESS}")
        [ -n "${VEX}" ] && args+=(--vex "/work/${VEX}")
        [ -n "${PROJECT}" ] && args+=(--project "${PROJECT}")
        [ -n "${VERSION}" ] && args+=(--version "${VERSION}")
        [ -n "${COMMIT}" ] && args+=(--commit "${COMMIT}")
        [ -n "${BUILD_URL}" ] && args+=(--build-url "${BUILD_URL}")

        docker run --rm -v "${GITHUB_WORKSPACE}:/work" -w /work "${IMAGE}" "${args[@]}"

        echo "report=${OUTPUT}" >> "${GITHUB_OUTPUT}"
