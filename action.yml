name: blitsbom SBOM report
# Keep under 125 characters: the Marketplace rejects a longer description at
# publish time, and nothing in CI checks it.
description: >-
  Turn a CycloneDX or SPDX SBOM into one self-contained HTML report you can
  attach to a release. Works offline.

inputs:
  sbom:
    description: Path to the source SBOM (JSON), relative to the workspace.
    required: true
  output:
    description: Output HTML path, relative to the workspace.
    required: false
    default: sbom-report.html
  vex:
    description: Optional CycloneDX VEX to merge, relative to the workspace.
    required: false
    default: ''
  compress:
    description: Payload encoding — auto | always | never.
    required: false
    default: auto
  project:
    description: Product name (defaults to the repository name).
    required: false
    default: ${{ github.event.repository.name }}
  version:
    description: Product version (defaults to the ref name, leading v stripped).
    required: false
    default: ''
  image:
    description: >-
      Report generator image to run. Defaults to the image matching the version
      of this action you called (`@v0.6.0` → `:report-0.6.0`), so the action and
      the generator cannot disagree.
    required: false
    default: ''

outputs:
  report:
    description: Path to the generated report (equal to the `output` input).
    value: ${{ steps.generate.outputs.report }}

branding:
  icon: file-text
  color: gray-dark

runs:
  using: composite
  steps:
    - id: generate
      shell: bash
      env:
        IMAGE_IN: ${{ inputs.image }}
        ACTION_REF: ${{ github.action_ref }}
        SBOM: ${{ inputs.sbom }}
        OUTPUT: ${{ inputs.output }}
        VEX: ${{ inputs.vex }}
        COMPRESS: ${{ inputs.compress }}
        PROJECT: ${{ inputs.project }}
        VERSION_IN: ${{ inputs.version }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        COMMIT: ${{ github.sha }}
        BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        # Version precedence: the explicit input, else the tag name with a
        # leading 'v' stripped (v2.4.1 → 2.4.1). Only derive from the ref when
        # it is actually a tag — on a branch or PR run github.ref_name is
        # "main" or "123/merge", which is not a version. When neither applies,
        # leave it empty so the report falls back to the SBOM's own version.
        VERSION="${VERSION_IN}"
        if [ -z "${VERSION}" ] && [ "${REF_TYPE}" = "tag" ]; then
          VERSION="${REF_NAME#v}"
        fi

        # Match the generator to the source the action itself came from, so the
        # two cannot disagree about their version. In precedence order:
        #
        #   1. the explicit `image:` input — always wins.
        #   2. a vX.Y.Z tag ref. The tag is authoritative rather than a proxy:
        #      docker.yml names the generator image from the git tag via
        #      `type=semver`, so the tag is literally what the image is called.
        #   3. a commit-SHA ref. No tag is available, so read the version the
        #      action ships with. The whole repository is materialised at
        #      GITHUB_ACTION_PATH for a remote action (#159), package.json
        #      included. Dependabot pins the release tag's commit, whose
        #      package.json carries that release's version, so a SHA pin
        #      resolves the same image a tag ref would.
        #   4. anything else — a branch ref, or a local `uses: ./` where
        #      action_ref is empty. :report-rc is the generator built from main,
        #      so for a ref that tracks main it is the matching pair, not a
        #      consolation prize. It is also the floor if a version cannot be
        #      read at all, which is why step 3 is allowed to fail quietly.
        IMAGE="${IMAGE_IN}"
        if [ -z "${IMAGE}" ]; then
          REGISTRY_IMAGE="ghcr.io/no42-org/blitsbom"
          RESOLVED_VERSION=""
          RESOLVED_FROM=""

          case "${ACTION_REF}" in
            v[0-9]*.[0-9]*.[0-9]*)
              RESOLVED_VERSION="${ACTION_REF#v}"
              RESOLVED_FROM="tag ${ACTION_REF}"
              ;;
          esac

          # A 40-character all-hex ref is a commit SHA. Checked by shape
          # because no context distinguishes a tag ref from a branch or a SHA.
          if [ -z "${RESOLVED_VERSION}" ] && [ "${#ACTION_REF}" -eq 40 ] &&
             [ -z "$(printf '%s' "${ACTION_REF}" | tr -d '0-9a-f')" ]; then
            PACKAGE_JSON="${GITHUB_ACTION_PATH}/package.json"
            if [ -f "${PACKAGE_JSON}" ]; then
              RESOLVED_VERSION="$(
                sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                  "${PACKAGE_JSON}" | head -1
              )"
              RESOLVED_FROM="package.json at the pinned commit"
            fi
          fi

          if [ -n "${RESOLVED_VERSION}" ]; then
            IMAGE="${REGISTRY_IMAGE}:report-${RESOLVED_VERSION}"
          else
            IMAGE="${REGISTRY_IMAGE}:report-rc"
            RESOLVED_FROM="no version for ref '${ACTION_REF}' — using the main-tip generator"
          fi

          echo "generator image: ${IMAGE} (${RESOLVED_FROM})"
        fi

        args=("/work/${SBOM}" --output "/work/${OUTPUT}" --compress "${COMPRESS}")
        [ -n "${VEX}" ] && args+=(--vex "/work/${VEX}")
        [ -n "${PROJECT}" ] && args+=(--project "${PROJECT}")
        [ -n "${VERSION}" ] && args+=(--version "${VERSION}")
        [ -n "${COMMIT}" ] && args+=(--commit "${COMMIT}")
        [ -n "${BUILD_URL}" ] && args+=(--build-url "${BUILD_URL}")

        docker run --rm -v "${GITHUB_WORKSPACE}:/work" -w /work "${IMAGE}" "${args[@]}"

        echo "report=${OUTPUT}" >> "${GITHUB_OUTPUT}"
